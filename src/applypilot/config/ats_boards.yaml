# ATS Board registries for ApplyPilot
# Greenhouse, Lever, and Ashby company career boards
#
# These ATS platforms have public JSON APIs — zero browser, zero LLM.
# The scraper fetches ALL open positions from each company, then filters
# by title keywords (from your searches.yaml queries) and location.
#
# To add a company:
#   1. Visit their careers page
#   2. Check if the URL contains greenhouse.io, lever.co, or ashbyhq.com
#   3. Extract the board token / slug from the URL
#   4. Add it below under the correct platform section
#
# Invalid entries are skipped gracefully (404 = silently ignored).

